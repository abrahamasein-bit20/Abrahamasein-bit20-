name: iValth model audit validation

on:
  pull_request:
    paths:
      - "world-concern-radar/supabase/functions/ivealth-model-audit/**"
      - ".github/workflows/model-audit-validation.yml"
  push:
    branches:
      - "research/open-model-stack"
    paths:
      - "world-concern-radar/supabase/functions/ivealth-model-audit/**"
      - ".github/workflows/model-audit-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Function
        run: deno check world-concern-radar/supabase/functions/ivealth-model-audit/index.ts

      - name: Lint Edge Function
        run: deno lint world-concern-radar/supabase/functions/ivealth-model-audit/index.ts
