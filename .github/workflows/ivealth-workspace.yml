name: iValth workspace validation

on:
  push:
    branches: [main]
    paths:
      - "ivealth-workspace/**"
      - ".github/workflows/ivealth-workspace.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ivealth-workspace
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build Next.js app
        run: npm run build
